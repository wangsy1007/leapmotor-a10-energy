services:
  leapmotor-collector:
    build: .
    image: leapmotor-a10-collector:local
    restart: unless-stopped
    ports:
      - "${BIND_PORT:-18080}:8080"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      DATABASE_PATH: /data/leapmotor.db
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
